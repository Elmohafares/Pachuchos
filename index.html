<!--
╔══════════════════════════════════════════════════════════════════════╗
║                 GUÍA DE EDICIÓN — PACHUCHOS ADVENTURE              ║
╚══════════════════════════════════════════════════════════════════════╝

Este archivo está pensado para que puedas editarlo SIN romper el diseño.

REGLA DE ORO:
- Si solo quieres cambiar textos/fotos/fechas, modifica únicamente el HTML
  de la sección correspondiente.
- No borres etiquetas <div> sin saber qué hacen.
- Cuando quieras añadir un recuerdo al TIMELINE, copia un bloque completo
  .timeline-item y cambia SOLO sus datos.
- Las rutas de imágenes son relativas a la carpeta "images/".

ESTRUCTURA GENERAL DEL DOCUMENTO
────────────────────────────────
1. <head>                 → fuentes, estilos y configuración.
2. HERO                   → portada principal.
3. RAÍCES / ENCUENTRO     → presentación de vuestra historia.
4. NOSOTROS               → las dos polaroids.
5. NAVEGACIÓN             → botones 01/02/03/04.
6. TIMELINE / HISTORIA    → recuerdos en forma de ruta.
7. FRASE                  → cita central.
8. ÁLBUM                  → fotos agrupadas por categorías.
9. FUTURO                 → cierre de la historia.
10. FOOTER                → pie de página.
11. <!-- ============================================================
     APARTADO 10 — JAVASCRIPT / ANIMACIONES
     No necesitas tocar esta parte para añadir recuerdos.
     El script detecta los elementos por sus clases y les aplica
     automáticamente las animaciones.
     ============================================================ -->
<script>              → animaciones y efectos JavaScript.

CÓMO CAMBIAR UNA FOTO
──────────────────────
Ejemplo:
    <img src="images/recuerdo-01.jpg" alt="El día que nos conocimos">

Si tu foto se llama "playa.jpg" y está dentro de images/:
    <img src="images/playa.jpg" alt="Nuestro día en la playa">

Puedes usar .jpg, .jpeg, .png o .webp.

CÓMO AÑADIR UN APARTADO NUEVO AL TIMELINE — MUY IMPORTANTE
────────────────────────────────────────────────────────────
NO necesitas modificar el SVG de la línea.

1. Busca un bloque que empiece por:
       <!--
╔══════════════════════════════════════════════════════════════════════╗
║                 AÑADIR UN RECUERDO AL TIMELINE                    ║
╚══════════════════════════════════════════════════════════════════════╝
Copia desde <article ...> hasta el </article> del recuerdo completo.

Después cambia únicamente:
1) <time>       → fecha
2) <h3>         → título
3) <p>          → descripción
4) src="..."    → foto
5) ubicación    → lugar, si existe

Para alternar el zigzag:
    class="timeline-item left reveal"
    class="timeline-item right reveal"

NO dupliques ni edites el <svg class="route-svg">.
La ruta es una sola y los nuevos recuerdos se colocan alrededor de ella.
-->
<article class="timeline-item ...">

2. Copia TODO ese <article> hasta su </article>.

3. Pégalo debajo del recuerdo anterior.

4. Cambia:
   - fecha
   - título
   - descripción
   - foto
   - ubicación (si la hay)

5. NO cambies:
   - class="timeline-item ..."
   - las clases internas
   - el SVG de la ruta
   - los scripts

El CSS y JavaScript detectan automáticamente los nuevos
.timeline-item, por lo que las animaciones seguirán funcionando.

IMPORTANTE SOBRE LA POSICIÓN:
- "left" y "right" hacen que el recuerdo aparezca a un lado de la ruta.
- Alterna entre left y right para conservar el efecto zigzag.
- Si copias un elemento con "timeline-item left", puedes cambiarlo a
  "timeline-item right".
- Si quieres muchos recuerdos, simplemente sigue copiando bloques.

EJEMPLO MÍNIMO:
    <article class="timeline-item right reveal">
        ...contenido...
    </article>

No tienes que crear una nueva línea SVG por cada recuerdo.

CÓMO AÑADIR UNA CATEGORÍA AL ÁLBUM
───────────────────────────────────
Busca:
    <section class="album-category ...">

Copia una categoría completa y cambia:
- nombre de categoría
- subtítulo
- nombres de las 3 fotos

Por ejemplo:
    "Nuestros viajes"
    "Lugares que queremos guardar"

La misma animación se aplicará automáticamente.

CÓMO AÑADIR MÁS FOTOS DENTRO DE UNA CATEGORÍA
───────────────────────────────────────────────
Copia un:
    <figure class="category-photo ...">

y cambia:
    src="images/mi-foto.jpg"
    alt="Descripción de la foto"

CÓMO CAMBIAR LOS TEXTOS
───────────────────────
Puedes buscar directamente el texto que quieras cambiar con
Ctrl + F en VS Code / Notepad++.

CÓMO NO ROMPER NADA
───────────────────
- Mantén cada etiqueta de apertura <div>, <article>, <section>, etc.
  con su etiqueta de cierre correspondiente.
- No elimines las clases CSS si no sabes para qué sirven.
- No cambies los nombres de las clases.
- Si quieres eliminar algo, es mejor comentarlo con <!-- ... -->
  antes que borrar estructuras importantes.
- Haz una copia del HTML antes de realizar cambios grandes.

ANIMACIONES
───────────
Las animaciones se activan automáticamente cuando haces scroll.
También hay:
- revelado de elementos
- zoom de fotografías
- inclinación de tarjetas
- partículas al hacer clic
- barra de progreso de scroll
- navegación activa
- ruta zigzag animada
- efecto de línea dibujada a mano
- soporte para "prefers-reduced-motion"

La línea del timeline ahora tiene un trazado ligeramente irregular
y un filtro SVG muy suave para que parezca hecha a mano con un
rotulador sobre una libreta/mapa.

===============================================================
FIN DE LA GUÍA RÁPIDA
===============================================================
-->

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ffffff">
<meta name="description" content="Nuestra pequeña aventura, una historia hecha de recuerdos.">
<title>Our Adventure · Fares &amp; Love</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
    --white:#fff;
    --paper:#fbfbfa;
    --ink:#101012;
    --muted:#6f6f75;
    --purple:#6846a8;
    --purple2:#8b69c5;
    --purple-soft:rgba(104,70,168,.10);
    --tape:rgba(214,198,164,.66);
    --line:#161618;
    --shadow:0 18px 45px rgba(16,16,18,.11);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
    background:var(--white);
    color:var(--ink);
    font-family:"DM Sans",sans-serif;
    overflow-x:hidden;
}
body::before{
    content:"✈   🧭   ✦   📍   🗺   ✎   ⛰   →   📷   ★   🧳   ☁   ♡   ✈   ✦   📍";
    position:fixed;
    inset:-12%;
    z-index:-2;
    pointer-events:none;
    color:#111;
    opacity:.032;
    font-family:"Caveat",cursive;
    font-size:clamp(24px,4vw,50px);
    line-height:3.5;
    word-spacing:45px;
    transform:rotate(-8deg);
}
a{color:inherit;text-decoration:none}
img{max-width:100%}
.kicker{
    color:var(--purple);
    font-size:.68rem;
    font-weight:800;
    letter-spacing:.22em;
    text-transform:uppercase;
}
.hand{font-family:"Caveat",cursive}
.muted{color:var(--muted)}

/* =====================================================
   FLOATING BACKGROUND DOODLES
===================================================== */
.floating{
    position:fixed;
    z-index:-1;
    pointer-events:none;
    color:#111;
    opacity:.055;
    font-family:"Caveat",cursive;
    font-size:1.4rem;
    animation:float 8s ease-in-out infinite;
}
.f1{left:6%;top:34%}.f2{right:7%;top:45%;animation-delay:1.5s}.f3{left:10%;top:75%;animation-delay:3s}.f4{right:10%;top:78%;animation-delay:4.5s}
@keyframes float{50%{transform:translateY(-9px) rotate(4deg)}}

/* =====================================================
   HERO
===================================================== */
.hero{
    min-height:100svh;
    display:grid;
    place-items:center;
    position:relative;
    text-align:center;
    padding:45px 20px 90px;
}
.hero-inner{width:min(900px,100%)}
.hero-small{
    display:inline-block;
    border-bottom:1.5px solid var(--ink);
    padding-bottom:7px;
    font-size:.68rem;
    letter-spacing:.25em;
    text-transform:uppercase;
}
.hero h1{
    font-family:"Caveat",cursive;
    font-weight:700;
    font-size:clamp(5.3rem,18vw,11rem);
    line-height:.77;
    margin:38px 0 28px;
    transform:rotate(-3deg);
}
.hero h1 span{color:var(--purple);display:inline-block}
.hero-description{
    max-width:510px;
    margin:auto;
    color:var(--muted);
    line-height:1.85;
    font-size:.94rem;
}
.hero-date{
    margin-top:25px;
    font-family:"Caveat",cursive;
    font-size:1.35rem;
}
.hero-doodle{
    position:absolute;
    color:var(--ink);
    font-family:"Caveat",cursive;
    font-size:2rem;
}
.hero-doodle.one{left:7%;top:23%;transform:rotate(-15deg)}
.hero-doodle.two{right:7%;top:20%;transform:rotate(12deg)}
.hero-doodle.three{left:13%;bottom:21%;transform:rotate(15deg)}
.hero-doodle.four{right:12%;bottom:18%;transform:rotate(-10deg)}
.scroll-note{
    position:absolute;
    bottom:27px;
    left:50%;
    transform:translateX(-50%);
    color:var(--muted);
    font-family:"Caveat",cursive;
    font-size:1.15rem;
}

/* =====================================================
   MINI PASSPORT / ORIGINS
===================================================== */
.origins{
    padding:20px 20px 115px;
}
.origins-inner{
    width:min(920px,100%);
    margin:auto;
}
.passport{
    position:relative;
    border:1px solid #1112;
    background:#fff;
    padding:45px 38px 40px;
    box-shadow:var(--shadow);
    overflow:hidden;
}
.passport::before{
    content:"TRAVEL NOTES";
    position:absolute;
    top:14px;
    right:18px;
    font-family:"Caveat",cursive;
    font-size:.9rem;
    color:#999;
    transform:rotate(4deg);
}
.passport-title{
    text-align:center;
    margin-bottom:28px;
}
.passport-title h2{
    font-family:"Caveat",cursive;
    font-size:3rem;
    line-height:1;
    margin:7px 0;
}
.passport-title p{font-size:.78rem;color:var(--muted)}
.origin-grid{
    display:grid;
    grid-template-columns:1fr 70px 1fr 70px 1fr;
    align-items:center;
    gap:10px;
}
.origin{
    text-align:center;
}
.flag{
    width:72px;
    height:48px;
    margin:auto;
    border:1px solid #1112;
    box-shadow:4px 5px 0 var(--purple-soft);
    display:grid;
    place-items:center;
    font-size:1.9rem;
    background:#fff;
}
.origin h3{
    font-family:"Caveat",cursive;
    font-size:1.7rem;
    margin-top:8px;
}
.origin p{
    color:var(--muted);
    font-size:.7rem;
    margin-top:2px;
}
.route-arrow{
    text-align:center;
    font-family:"Caveat",cursive;
    font-size:2rem;
    transform:rotate(-5deg);
}
.origin-note{
    margin-top:30px;
    text-align:center;
    font-family:"Caveat",cursive;
    font-size:1.2rem;
    color:var(--muted);
}

/* =====================================================
   INTRO
===================================================== */
.intro{padding:40px 20px 130px}
.intro-inner{width:min(900px,100%);margin:auto}
.intro-photos{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:26px;
    align-items:center;
}
.polaroid{
    background:#fff;
    padding:10px 10px 45px;
    box-shadow:var(--shadow);
    position:relative;
}
.polaroid:first-child{transform:rotate(-4deg)}
.polaroid:last-child{transform:rotate(5deg);margin-top:50px}
.polaroid::before{
    content:"";
    position:absolute;
    width:75px;height:20px;
    top:-9px;left:50%;
    transform:translateX(-50%) rotate(-2deg);
    background:var(--tape);
}
.polaroid img{
    display:block;
    width:100%;
    aspect-ratio:4/5;
    object-fit:cover;
    background:#eee;
}
.polaroid figcaption{
    position:absolute;
    left:0;bottom:7px;width:100%;
    text-align:center;
    font-family:"Caveat",cursive;
    font-size:1.25rem;
}
.intro-text{
    max-width:690px;
    margin:78px auto 0;
    text-align:center;
}
.intro-text h2{
    font-family:"Caveat",cursive;
    font-size:3.7rem;
    margin:8px 0 15px;
}
.intro-text p{color:var(--muted);line-height:1.9}

/* =====================================================
   NAVIGATION
===================================================== */
.chapter-nav{
    position:sticky;
    top:10px;
    z-index:20;
    width:min(900px,calc(100% - 30px));
    margin:0 auto 60px;
    display:flex;
    justify-content:center;
    gap:6px;
    padding:7px;
    background:rgba(255,255,255,.88);
    border:1px solid #1111;
    box-shadow:0 8px 25px rgba(0,0,0,.06);
    backdrop-filter:blur(12px);
}
.chapter-nav a{
    padding:9px 12px;
    border-radius:30px;
    font-size:.68rem;
    font-weight:700;
    color:#666;
    transition:.2s;
}
.chapter-nav a:hover{background:var(--purple-soft);color:var(--purple)}

/* =====================================================
   TIMELINE / MAP
===================================================== */
.timeline-section{padding:60px 18px 150px;position:relative}
.section-heading{
    width:min(700px,100%);
    margin:0 auto 85px;
    text-align:center;
}
.section-heading h2{
    font-family:"Caveat",cursive;
    font-size:clamp(3.2rem,8vw,5rem);
    line-height:1;
    margin:8px 0 13px;
    transform:rotate(-2deg);
}
.section-heading p{color:var(--muted);line-height:1.75}
.timeline{
    width:min(900px,100%);
    margin:auto;
    position:relative;
}
.zigzag-line{
    position:absolute;
    top:0;
    bottom:0;
    left:50%;
    width:110px;
    height:100%;
    transform:translateX(-50%);
    overflow:visible;
    pointer-events:none;
}
.zigzag-line path{
    fill:none;
    stroke:var(--line);
    stroke-width:2.1;
    stroke-linecap:round;
    stroke-linejoin:round;
    stroke-dasharray:6 8;
}
.timeline-item{
    width:50%;
    position:relative;
    padding:0 62px 115px 0;
}
.timeline-item:nth-of-type(even){
    margin-left:50%;
    padding:0 0 115px 62px;
}
.timeline-pin{
    position:absolute;
    top:15px;
    right:-17px;
    width:35px;height:35px;
    border:2px solid var(--ink);
    background:#fff;
    border-radius:50%;
    display:grid;
    place-items:center;
    z-index:3;
    font-size:1rem;
    filter:grayscale(1);
}
.timeline-item:nth-of-type(even) .timeline-pin{left:-17px;right:auto}
.memory-card{
    background:#fff;
    border:1px solid #1112;
    box-shadow:9px 13px 0 var(--purple-soft),var(--shadow);
    padding:24px;
    position:relative;
    transition:.25s;
}
.timeline-item:nth-of-type(odd) .memory-card{transform:rotate(-2deg)}
.timeline-item:nth-of-type(even) .memory-card{transform:rotate(2deg)}
.memory-card:hover{
    transform:rotate(0) translateY(-5px)!important;
    box-shadow:12px 17px 0 var(--purple-soft),0 22px 42px rgba(0,0,0,.13);
}
.memory-card::before{
    content:"";
    position:absolute;
    width:70px;height:19px;
    top:-9px;left:50%;
    transform:translateX(-50%) rotate(-2deg);
    background:var(--tape);
}
.memory-date{color:var(--purple);font-family:"Caveat",cursive;font-size:1.45rem}
.memory-card h3{font-size:1.25rem;margin:3px 0 10px}
.memory-card p{color:var(--muted);font-size:.9rem;line-height:1.75}
.memory-photo{
    margin-top:17px;
    padding:6px;
    background:#f0f0f0;
    box-shadow:0 8px 18px rgba(0,0,0,.1);
    transform:rotate(2deg);
}
.memory-photo img{
    width:100%;display:block;
    aspect-ratio:16/10;
    object-fit:cover;
}
.memory-location{
    margin-top:14px;
    color:#777;
    font-size:.68rem;
    letter-spacing:.14em;
    text-transform:uppercase;
}
.big-memory{
    width:min(680px,100%);
    margin:10px auto 100px;
    position:relative;
    text-align:center;
}
.big-memory .memory-photo{
    transform:rotate(-1deg);
    padding:9px;
    background:#fff;
}
.big-memory .memory-photo img{aspect-ratio:16/10}
.big-memory h3{
    font-family:"Caveat",cursive;
    font-size:3.1rem;
    margin:15px 0 5px;
}
.big-memory p{color:var(--muted);line-height:1.8}

/* =====================================================
   ALBUM CATEGORIES
===================================================== */
.album-section{
    padding:115px 18px 150px;
    background:#f7f7f8;
    border-top:1px solid #1111;
}
.album-categories{width:min(920px,100%);margin:auto;display:grid;gap:80px}
.album-category{position:relative}
.category-title{
    display:flex;
    align-items:end;
    gap:13px;
    margin-bottom:20px;
}
.category-number{font-family:"Caveat",cursive;color:var(--purple);font-size:1.3rem}
.category-title h3{font-family:"Caveat",cursive;font-size:2.5rem;line-height:1}
.category-title p{color:#777;font-size:.75rem;margin-bottom:3px}
.category-line{
    width:100%;
    height:2px;
    background:var(--ink);
    margin-bottom:20px;
    position:relative;
}
.category-line::after{
    content:"✦";
    position:absolute;
    right:0;top:-13px;
    color:var(--purple);
    background:#f7f7f8;
    padding-left:7px;
}
.category-photos{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:18px;
}
.category-photo{
    background:#fff;
    padding:8px 8px 31px;
    box-shadow:0 10px 25px rgba(0,0,0,.09);
    position:relative;
}
.category-photo:nth-child(1){transform:rotate(-2deg)}
.category-photo:nth-child(2){transform:rotate(2deg);margin-top:25px}
.category-photo:nth-child(3){transform:rotate(-1deg)}
.category-photo img{
    display:block;
    width:100%;
    aspect-ratio:1/1;
    object-fit:cover;
    background:#ddd;
}
.category-photo figcaption{
    position:absolute;
    bottom:4px;left:0;width:100%;
    text-align:center;
    font-family:"Caveat",cursive;
    font-size:1rem;
}

/* =====================================================
   QUOTE / SCRAP
===================================================== */
.quote{
    padding:95px 20px;
    text-align:center;
    background:#fff;
}
.quote-inner{
    width:min(680px,100%);
    margin:auto;
}
.quote-mark{
    color:var(--purple);
    font-size:3rem;
    font-family:"Caveat",cursive;
}
.quote p{
    font-family:"Caveat",cursive;
    font-size:clamp(2rem,6vw,3.3rem);
    line-height:1.1;
    transform:rotate(-1deg);
}
.quote small{
    display:block;
    margin-top:20px;
    color:#888;
}

/* =====================================================
   FINAL
===================================================== */
.ending{
    min-height:78svh;
    display:grid;
    place-items:center;
    text-align:center;
    padding:90px 20px;
}
.ending h2{
    font-family:"Caveat",cursive;
    font-size:clamp(4.3rem,15vw,8.5rem);
    line-height:.82;
    transform:rotate(-3deg);
}
.ending h2 span{color:var(--purple)}
.ending p{margin-top:30px;color:var(--muted)}
footer{
    text-align:center;
    padding:25px;
    color:#888;
    font-size:.68rem;
    letter-spacing:.12em;
    text-transform:uppercase;
}


/* =====================================================
   ANIMACIONES · SCRAPBOOK VIVO
===================================================== */

.reveal{
    opacity:0;
    transform:translateY(35px);
    transition:
        opacity .8s cubic-bezier(.2,.75,.2,1),
        transform .8s cubic-bezier(.2,.75,.2,1);
}
.reveal.is-visible{
    opacity:1;
    transform:none;
}

.reveal-left{
    opacity:0;
    transform:translateX(-45px) rotate(-3deg);
    transition:
        opacity .8s ease,
        transform .9s cubic-bezier(.2,.75,.2,1);
}
.reveal-left.is-visible{
    opacity:1;
    transform:translateX(0) rotate(-2deg);
}

.reveal-right{
    opacity:0;
    transform:translateX(45px) rotate(3deg);
    transition:
        opacity .8s ease,
        transform .9s cubic-bezier(.2,.75,.2,1);
}
.reveal-right.is-visible{
    opacity:1;
    transform:translateX(0) rotate(2deg);
}

/* entrada suave de la portada */
.hero-inner{
    animation:heroEnter 1.15s cubic-bezier(.16,1,.3,1) both;
}
@keyframes heroEnter{
    from{opacity:0;transform:translateY(25px) scale(.97)}
    to{opacity:1;transform:none}
}

.hero-doodle{
    animation:doodleFloat 5s ease-in-out infinite;
}
@keyframes doodleFloat{
    0%,100%{translate:0 0;rotate:0deg}
    50%{translate:0 -8px;rotate:4deg}
}

/* pequeños elementos que flotan por el fondo */
.floating{
    animation:float 7s ease-in-out infinite;
}
.f1{animation-delay:.2s}
.f2{animation-delay:1.4s}
.f3{animation-delay:2.8s}
.f4{animation-delay:4s}

/* Pasaporte / raíces */
.passport{
    transform:rotate(-.7deg);
    transition:transform .5s ease,box-shadow .5s ease;
}
.passport:hover{
    transform:rotate(0) translateY(-4px);
    box-shadow:0 24px 55px rgba(16,16,18,.13);
}
.passport-stamp{
    position:absolute;
    left:22px;
    top:17px;
    width:38px;
    height:38px;
    border:1.5px dashed var(--purple);
    border-radius:50%;
    display:grid;
    place-items:center;
    color:var(--purple);
    transform:rotate(-15deg);
    opacity:.7;
}
.route-story{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:13px;
    margin-top:34px;
}
.route-word{
    font-family:"Caveat",cursive;
    font-size:1.35rem;
    color:var(--ink);
    white-space:nowrap;
}
.route-line{
    width:65px;
    height:1px;
    background:var(--ink);
    position:relative;
}
.route-line::after{
    content:"→";
    position:absolute;
    right:-4px;
    top:-12px;
    font-family:"Caveat",cursive;
    font-size:1.1rem;
}

/* Progreso de lectura */
.scroll-progress{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:3px;
    z-index:100;
    pointer-events:none;
}
.scroll-progress span{
    display:block;
    width:0%;
    height:100%;
    background:var(--purple);
    box-shadow:0 0 12px rgba(104,70,168,.45);
}

/* El camino se "dibuja" mientras avanzas */
.zigzag-line path{
    stroke-dasharray:8 10;
    animation:pathDash 1.8s linear infinite;
}
@keyframes pathDash{
    to{stroke-dashoffset:-36}
}

/* puntos de timeline con pequeño pulso */
.timeline-pin{
    transition:transform .3s ease,background .3s ease,box-shadow .3s ease;
}
.timeline-item.is-visible .timeline-pin{
    animation:pinPop .65s cubic-bezier(.2,1.6,.4,1) both;
}
.timeline-item.is-visible .timeline-pin:hover{
    transform:scale(1.12);
    box-shadow:0 0 0 7px var(--purple-soft);
}
@keyframes pinPop{
    0%{transform:scale(0);opacity:0}
    70%{transform:scale(1.15)}
    100%{transform:scale(1);opacity:1}
}

/* Cartas: aparecen como recuerdos que se colocan sobre la mesa */
.memory-card,
.category-photo,
.big-memory{
    will-change:transform;
}
.timeline-item .memory-card{
    transition:
        transform .35s ease,
        box-shadow .35s ease;
}
.timeline-item .memory-card:hover{
    transform:rotate(0deg) translateY(-9px) scale(1.012)!important;
}

/* brillo muy sutil al pasar por una foto */
.memory-photo,
.category-photo{
    overflow:hidden;
}
.memory-photo img,
.category-photo img{
    transition:transform .7s cubic-bezier(.2,.75,.2,1),filter .7s ease;
}
.memory-photo:hover img,
.category-photo:hover img{
    transform:scale(1.045);
    filter:saturate(1.06);
}

/* títulos que se levantan ligeramente */
.section-heading h2,
.intro-text h2,
.category-title h3,
.ending h2{
    transition:transform .35s ease;
}
.section-heading:hover h2{transform:rotate(-2deg) translateY(-3px)}
.intro-text:hover h2{transform:translateY(-3px) rotate(-1deg)}
.category-title:hover h3{transform:translateX(3px)}
.ending:hover h2{transform:rotate(-3deg) translateY(-4px)}

/* navegación activa */
.chapter-nav a.active{
    color:#fff;
    background:var(--ink);
}

/* mini partículas creadas por JS */
.spark{
    position:fixed;
    width:5px;
    height:5px;
    border-radius:50%;
    background:var(--purple);
    pointer-events:none;
    z-index:90;
    animation:sparkOut .75s ease-out forwards;
}
@keyframes sparkOut{
    0%{opacity:.8;transform:translate(0,0) scale(1)}
    100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(0)}
}

/* efecto de entrada para las fotos */
.photo-pop{
    animation:photoPop .85s cubic-bezier(.2,.8,.2,1) both;
}
@keyframes photoPop{
    from{opacity:0;transform:scale(.94) rotate(-1deg)}
    to{opacity:1;transform:scale(1) rotate(0)}
}

/* Accesibilidad */
@media(prefers-reduced-motion:reduce){
    html{scroll-behavior:auto}
    *,*::before,*::after{
        animation-duration:.001ms!important;
        animation-iteration-count:1!important;
        transition-duration:.001ms!important;
    }
}

<script>
(() => {
    "use strict";

    const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    /* ==========================================
       1. SCROLL REVEAL
    ========================================== */
    const revealItems = document.querySelectorAll(
        ".reveal, .reveal-left, .reveal-right, .timeline-item"
    );

    const revealObserver = new IntersectionObserver((entries, observer) => {
        entries.forEach((entry, index) => {
            if (!entry.isIntersecting) return;

            entry.target.style.transitionDelay =
                reduceMotion ? "0ms" : `${Math.min(index * 55, 220)}ms`;

            entry.target.classList.add("is-visible");
            observer.unobserve(entry.target);
        });
    }, {
        threshold: 0.12,
        rootMargin: "0px 0px -7% 0px"
    });

    revealItems.forEach(el => revealObserver.observe(el));

    /* ==========================================
       2. BARRA DE PROGRESO
    ========================================== */
    const progress = document.querySelector(".scroll-progress span");

    function updateProgress(){
        const doc = document.documentElement;
        const max = doc.scrollHeight - window.innerHeight;
        const percentage = max > 0 ? (window.scrollY / max) * 100 : 0;
        progress.style.width = `${percentage}%`;
    }

    window.addEventListener("scroll", updateProgress, {passive:true});
    updateProgress();

    /* ==========================================
       3. PARALLAX MUY SUAVE DE DOODLES
    ========================================== */
    if (!reduceMotion) {
        const doodles = document.querySelectorAll(".floating, .hero-doodle");

        window.addEventListener("scroll", () => {
            const y = window.scrollY;

            doodles.forEach((el, i) => {
                const amount = (i % 2 === 0 ? 1 : -1) * 0.018;
                el.style.marginTop = `${y * amount}px`;
            });
        }, {passive:true});
    }

    /* ==========================================
       4. NAVEGACIÓN ACTIVA
    ========================================== */
    const navLinks = [...document.querySelectorAll(".chapter-nav a")];
    const sections = navLinks
        .map(link => document.querySelector(link.getAttribute("href")))
        .filter(Boolean);

    const navObserver = new IntersectionObserver(entries => {
        entries.forEach(entry => {
            if (!entry.isIntersecting) return;

            navLinks.forEach(link => {
                link.classList.toggle(
                    "active",
                    link.getAttribute("href") === `#${entry.target.id}`
                );
            });
        });
    }, {
        rootMargin: "-35% 0px -55% 0px"
    });

    sections.forEach(section => navObserver.observe(section));

    /* ==========================================
       5. PEQUEÑAS CHISPAS AL HACER CLICK
    ========================================== */
    if (!reduceMotion) {
        document.addEventListener("click", event => {
            if (!event.target.closest(".memory-card, .category-photo, .polaroid, .chapter-nav")) {
                return;
            }

            const amount = 5;

            for (let i = 0; i < amount; i++) {
                const spark = document.createElement("span");
                spark.className = "spark";

                const dx = (Math.random() - .5) * 65;
                const dy = (Math.random() - .5) * 65;

                spark.style.left = `${event.clientX}px`;
                spark.style.top = `${event.clientY}px`;
                spark.style.setProperty("--dx", `${dx}px`);
                spark.style.setProperty("--dy", `${dy}px`);

                document.body.appendChild(spark);
                setTimeout(() => spark.remove(), 800);
            }
        });
    }

    /* ==========================================
       6. FOTOS: REVELADO CUANDO ENTRAN EN PANTALLA
    ========================================== */
    const photos = document.querySelectorAll(".memory-photo img, .category-photo img, .polaroid img");

    const photoObserver = new IntersectionObserver(entries => {
        entries.forEach(entry => {
            if (!entry.isIntersecting) return;
            entry.target.classList.add("photo-pop");
            photoObserver.unobserve(entry.target);
        });
    }, {threshold:.18});

    photos.forEach(photo => photoObserver.observe(photo));

    /* ==========================================
       7. TILT MUY SUTIL EN ESCRITORIO
       Las tarjetas reaccionan al ratón.
    ========================================== */
    if (!reduceMotion && window.matchMedia("(pointer:fine)").matches) {
        document.querySelectorAll(".memory-card, .passport").forEach(card => {
            card.addEventListener("mousemove", e => {
                const rect = card.getBoundingClientRect();
                const x = (e.clientX - rect.left) / rect.width - .5;
                const y = (e.clientY - rect.top) / rect.height - .5;

                card.style.transform =
                    `perspective(900px) rotateX(${y * -2}deg) rotateY(${x * 2}deg) translateY(-4px)`;
            });

            card.addEventListener("mouseleave", () => {
                card.style.transform = "";
            });
        });
    }

    /* ==========================================
       8. FECHA ACTUAL PARA LA "PRÓXIMA PARADA"
       Solo si algún día quieres mostrarla.
    ========================================== */
})();
</script>

</body>
</html>
